<!DOCTYPE html>
<html lang="en">
    <head>
        <meta character="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../Styles/login-signup-styles.css">
        <title>LogIn</title>
    </head>
    <body>
        <div class="forms">
            <h1>Login Form</h1>
            <form name="form" backend-url="http://localhost/cinema-booking-backend/Controllers/LogIn.php" page_name="LogIn" id="outside_form" method="POST">
                <label>Email: </label>
                <input type="email" class="user" placeholder="example@email.com" name="email">
                <br><br>
                <label>Password: </label>
                <input type="password" class="pass" name="password">
                <br><br>
                <button type="submit" class="btn">LogIn</button>
                <button type="button" class="btn" onclick="window.location.href='SignUp.html'">SignIn</button>
            </form>
        </div>
    </body>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script type="module" src="../Scripts/SignUp.js" defer></script>
</html>
