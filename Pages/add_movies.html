<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Movie Details</title>
  <link rel="stylesheet" href="../Styles/Movies.css" />
</head>
<body>
  <div class="movie-details">
    <h1 id="title">Loading...</h1>
    <img id="movie-poster" src="" alt="Movie Poster" style="max-width: 300px;" />
    <p id="movie-description"></p>
    
    <p><strong>Genre:</strong> <span id="genre"></span></p>
    <p><strong>Director:</strong> <span id="director"></span></p>
    <p><strong>Cast:</strong> <span id="actors"></span></p>
    <p><strong>Duration:</strong> <span id="duration_minutes"></span> minutes</p>
    <p><strong>Release Date:</strong> <span id="release_date"></span></p>
    <p><strong>Rating:</strong> <span id="rating"></span></p>
    <p><strong>Language:</strong> <span id="language"></span></p>

    <a id="trailer_url" class="button_movie" href="#" target="_blank">Watch Trailer</a>
    <a  class="button_movie" href="Book_ticket.html" target="_blank">Book Ticket</a>
  </div>

  <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
  <script src="../Scripts/Movies_with_description.js"></script> <!-- Make sure this file has the JS you showed earlier -->
</body>
</html>
